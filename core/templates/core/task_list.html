<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    li { margin: 8px 0; }
    .done { text-decoration: line-through; color: gray; }
    form { display: inline; }
  </style>
</head>
<body>
  <h1>Task Manager</h1>

  <form method="post">
    {% csrf_token %}
    <input type="text" name="title" placeholder="New task" required>
    <button type="submit">Add</button>
  </form>

  <ul>
    {% for task in tasks %}
      <li>
        <span class="{% if task.completed %}done{% endif %}">{{ task.title }}</span>
        <form method="post" action="{% url 'toggle_task' task.pk %}">
          {% csrf_token %}<button>{% if task.completed %}Undo{% else %}Done{% endif %}</button>
        </form>
        <form method="post" action="{% url 'delete_task' task.pk %}">
          {% csrf_token %}<button>Delete</button>
        </form>
      </li>
    {% empty %}
      <li>No tasks yet.</li>
    {% endfor %}
  </ul>
</body>
</html>
